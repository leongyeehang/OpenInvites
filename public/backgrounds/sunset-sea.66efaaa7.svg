<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1600" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b1a4a"/>
      <stop offset="0.45" stop-color="#c2496b"/>
      <stop offset="0.62" stop-color="#ff9a5a"/>
      <stop offset="0.7" stop-color="#ffd27a"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb37a"/>
      <stop offset="0.3" stop-color="#7a3b6a"/>
      <stop offset="1" stop-color="#1b0f2b"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff2c2"/>
      <stop offset="0.6" stop-color="#ffcf6b"/>
      <stop offset="1" stop-color="#ffcf6b" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="18"/></filter>
  </defs>
  <rect width="1200" height="1120" fill="url(#sky)"/>
  <g fill="#ffb5a0" opacity="0.45" filter="url(#blur)">
    <ellipse cx="300" cy="700" rx="260" ry="40"/>
    <ellipse cx="900" cy="820" rx="220" ry="34"/>
    <ellipse cx="560" cy="560" rx="180" ry="26"/>
  </g>
  <circle cx="600" cy="1060" r="260" fill="url(#sun)"/>
  <circle cx="600" cy="1060" r="150" fill="#ffe9a8"/>
  <rect y="1120" width="1200" height="480" fill="url(#sea)"/>
  <g fill="#ffd9a0" opacity="0.6" filter="url(#blur)">
    <rect x="420" y="1130" width="360" height="14"/>
    <rect x="460" y="1170" width="280" height="10"/>
    <rect x="500" y="1220" width="200" height="8"/>
    <rect x="530" y="1280" width="140" height="6"/>
  </g>
</svg>
