name: CI

on:
  # Branches only: a release tag runs these same checks through release.yml, before publishing.
  push:
    branches: ["**"]
  pull_request:
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  checks:
    name: Lint, types, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm test

      - name: S3 storage smoke test against a local S3-compatible server
        run: |
          docker compose --profile s3 up -d --wait
          pnpm test:s3

      - name: Stop the S3 server
        if: always()
        run: docker compose --profile s3 down -v

  browser:
    name: Browser tests (${{ matrix.name }})
    runs-on: ubuntu-latest
    # The browser suite has about 1,200 tests, some two hours in one job, so it runs in six, each
    # on a test stack of its own and about 25 minutes long. The tests at the two widths are split
    # five ways. The specs that need an instance of their own (the projects named *-instance in
    # playwright.config.ts) run one after another whatever else does, 20 minutes in all, so they
    # have a job to themselves: sharing the last of three shards with 380 other tests they took
    # it to 59 of these 60 minutes at 0.8.0. Playwright puts the operator's setup in every job.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: 1 of 5, tests: --project=mobile --project=desktop --shard=1/5 }
          - { name: 2 of 5, tests: --project=mobile --project=desktop --shard=2/5 }
          - { name: 3 of 5, tests: --project=mobile --project=desktop --shard=3/5 }
          - { name: 4 of 5, tests: --project=mobile --project=desktop --shard=4/5 }
          - { name: 5 of 5, tests: --project=mobile --project=desktop --shard=5/5 }
          - { name: own instances, tests: "--project='*-instance'" }
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Start the test stack (app, Postgres 18, fake mail)
        run: docker compose --profile test up -d --build --wait

      - name: Browser tests at 390px and desktop widths
        run: pnpm exec playwright test ${{ matrix.tests }}

      - name: App logs
        if: failure()
        run: docker compose --profile test logs app app-fresh worker-fresh app-no-mail

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report ${{ matrix.name }}
          path: playwright-report/
          retention-days: 7

      - name: Stop the test stack
        if: always()
        run: docker compose --profile test down -v
