name: CI

on:
  # Branches only: a release tag runs these same checks through release.yml, before publishing.
  push:
    branches: ["**"]
  pull_request:
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  checks:
    name: Lint, types, unit tests, browser tests
    runs-on: ubuntu-latest
    # The browser suite has 385 tests and takes about 26 minutes.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm test

      - name: S3 storage smoke test against a local S3-compatible server
        run: |
          docker compose --profile s3 up -d --wait
          pnpm test:s3

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Start the test stack (app, Postgres 18, fake mail)
        run: docker compose --profile test up -d --build --wait

      - name: Browser tests at 390px and desktop widths
        run: pnpm exec playwright test

      - name: App logs
        if: failure()
        run: docker compose --profile test logs app app-fresh app-no-mail

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Stop the test stack
        if: always()
        run: docker compose --profile test --profile s3 down -v
