name: CI

on:
  # Branches only: a release tag runs these same checks through release.yml, before publishing.
  push:
    branches: ["**"]
  pull_request:
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  checks:
    name: Lint, types, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm test

      - name: S3 storage smoke test against a local S3-compatible server
        run: |
          docker compose --profile s3 up -d --wait
          pnpm test:s3

      - name: Stop the S3 server
        if: always()
        run: docker compose --profile s3 down -v

  browser:
    name: Browser tests (${{ matrix.shard }} of 3)
    runs-on: ubuntu-latest
    # The browser suite has about 640 tests, over an hour in one job, so it runs in three, each
    # on a test stack of its own. Playwright puts the operator's setup in every shard, and the
    # specs that need an instance of their own (the fresh-instance chain) all in one.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Start the test stack (app, Postgres 18, fake mail)
        run: docker compose --profile test up -d --build --wait

      - name: Browser tests at 390px and desktop widths
        run: pnpm exec playwright test --shard=${{ matrix.shard }}/3

      - name: App logs
        if: failure()
        run: docker compose --profile test logs app app-fresh app-no-mail

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 7

      - name: Stop the test stack
        if: always()
        run: docker compose --profile test down -v
