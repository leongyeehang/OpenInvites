name: openinvites

services:
  db:
    image: postgres:18-alpine
    profiles: [dev, test]
    environment:
      POSTGRES_USER: openinvites
      POSTGRES_PASSWORD: openinvites
      POSTGRES_DB: openinvites
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openinvites -d openinvites"]
      interval: 5s
      timeout: 3s
      retries: 12

  app:
    build: .
    profiles: [test]
    environment:
      DATABASE_URL: postgres://openinvites:openinvites@db:5432/openinvites
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
      mail:
        condition: service_started

  mail:
    image: axllent/mailpit
    profiles: [test]
    ports:
      - "8025:8025"

volumes:
  db-data:
