name: openinvites

services:
  db:
    image: postgres:18-alpine
    profiles: [dev, test]
    environment:
      POSTGRES_USER: openinvites
      POSTGRES_PASSWORD: openinvites
      POSTGRES_DB: openinvites
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openinvites -d openinvites"]
      interval: 5s
      timeout: 3s
      retries: 12

  app:
    build: .
    profiles: [test]
    environment:
      DATABASE_URL: postgres://openinvites:openinvites@db:5432/openinvites
      BASE_URL: http://localhost:3000
      AUTH_SECRET: test-profile-only-secret-change-me-0123456789abcdef
      SMTP_URL: smtp://mail:1025
      MAIL_FROM: OpenInvites <no-reply@openinvites.test>
      OPERATOR_CONTACT_EMAIL: operator@openinvites.test
      # The browser tests' operator (e2e/operator.setup.ts), who opens registration to everyone
      # before the other specs run, since each of them signs up hosts of its own.
      OPERATOR_EMAIL: operator@openinvites.test
    ports:
      - "3000:3000"
    # Uploaded pictures on local disk, the default storage, in a named volume as an operator keeps them.
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      mail:
        condition: service_started

  # Same image as `app`, with dummy Google and GitHub credentials, on its own port. Backs the one
  # spec that checks the sign-in and sign-up buttons appear once the operator has configured a
  # provider (`app` above has none configured, so it covers the buttons-absent case). No test
  # ever calls Google or GitHub with these credentials.
  app-social:
    build: .
    profiles: [test]
    environment:
      DATABASE_URL: postgres://openinvites:openinvites@db:5432/openinvites
      BASE_URL: http://localhost:3001
      AUTH_SECRET: test-profile-only-secret-change-me-0123456789abcdef
      SMTP_URL: smtp://mail:1025
      MAIL_FROM: OpenInvites <no-reply@openinvites.test>
      OPERATOR_CONTACT_EMAIL: operator@openinvites.test
      GOOGLE_CLIENT_ID: dummy-google-client-id
      GOOGLE_CLIENT_SECRET: dummy-google-client-secret
      GITHUB_CLIENT_ID: dummy-github-client-id
      GITHUB_CLIENT_SECRET: dummy-github-client-secret
    ports:
      - "3001:3000"
    depends_on:
      db:
        condition: service_healthy
      mail:
        condition: service_started

  # A second instance of the same image, for what depends on the whole instance being in one
  # state: who the first account is, and the registration mode. `app` cannot offer that, as every
  # other spec shares its database and it persists between runs. This one's database lives in
  # memory, so it is empty whenever db-fresh starts, and e2e/registration.spec.ts recreates both
  # containers before it runs: every run starts from nothing, on CI and on a laptop alike.
  db-fresh:
    image: postgres:18-alpine
    profiles: [test]
    environment:
      POSTGRES_USER: openinvites
      POSTGRES_PASSWORD: openinvites
      POSTGRES_DB: openinvites
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openinvites -d openinvites"]
      interval: 2s
      timeout: 3s
      retries: 30

  app-fresh:
    build: .
    profiles: [test]
    environment:
      DATABASE_URL: postgres://openinvites:openinvites@db-fresh:5432/openinvites
      BASE_URL: http://localhost:3002
      AUTH_SECRET: test-profile-only-secret-change-me-0123456789abcdef
      SMTP_URL: smtp://mail:1025
      MAIL_FROM: OpenInvites <no-reply@openinvites.test>
      OPERATOR_EMAIL: operator@fresh.openinvites.test
    ports:
      - "3002:3000"
    depends_on:
      db-fresh:
        condition: service_healthy
      mail:
        condition: service_started

  # Fake mail server: catches every email the app sends. Web UI on 8025, SMTP on 1025.
  mail:
    image: axllent/mailpit
    profiles: [dev, test]
    environment:
      # Reverse DNS on each connection is slow behind Docker's port proxy and buys nothing here.
      MP_SMTP_DISABLE_RDNS: "true"
    ports:
      - "8025:8025"
      - "1025:1025"

  # S3-compatible storage for the smoke test of the S3 implementation (pnpm test:s3): Versity
  # Gateway (Apache-2.0), serving a directory. Its one bucket is a directory made as it starts.
  s3:
    image: versity/versitygw:v1.8.0
    profiles: [s3]
    environment:
      ROOT_ACCESS_KEY: openinvites
      ROOT_SECRET_KEY: s3-profile-only-secret
    entrypoint: ["sh", "-c", "mkdir -p /data/openinvites && exec versitygw --health /health posix /data"]
    ports:
      - "7070:7070"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:7070/health"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  db-data:
  uploads:
